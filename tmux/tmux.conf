# tmux config: keybindings and behavior ported from nix-config (megamackan).
# Appearance not done yet. Plugins via TPM: `prefix + I` installs them.

# --- Basics ------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

setw -g mode-keys vi
set -g mouse on
set -sg escape-time 0
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -sa terminal-features ',xterm-ghostty:RGB'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g focus-events on
setw -g aggressive-resize on
set -g detach-on-destroy off

setw -g monitor-activity off
set -g bell-action none
set -g visual-bell off
set -g visual-activity off

# --- Keybindings -------------------------------------------------------------
# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'

# windows
bind C-p previous-window
bind C-n next-window
bind -r n next-window
bind -r p previous-window
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

# panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# vim-aware pane navigation (no prefix)
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# splits + new windows keep the current dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# sesh: fuzzy session switcher (overrides the default clock on 't')
unbind t
bind t display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list -tcd | sort | fzf --reverse --no-sort --border --border-label " sesh " --prompt "  ")"'

# toggle status bar
bind-key b set-option status

# --- Clipboard (Wayland) -----------------------------------------------------
set-option -g set-clipboard on
set-option -s copy-command "wl-copy"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key P run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# --- Plugins (TPM) -----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep last of resurrect/continuum

# Restore each pane's scrollback so restored windows are recognizable.
set -g @resurrect-capture-pane-contents 'on'
# Don't relaunch programs: Claude would start a new conversation, not resume.
# Use `claude --resume` per window instead.
set -g @resurrect-processes 'false'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
